<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feyenoord Nieuwsfeed</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div id="datetime"></div>
        <div id="weather">
            <span id="weather-icon"></span>
            <span>Loading weather...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="content-wrapper">
        <section class="news-image" id="news-image">
            <!-- News Image will be dynamically loaded here -->
        </section>
        <article class="news-article" id="news-article">
            <time class="news-date-time" id="news-date-time">
                <!-- Date and time will be inserted here -->
            </time>
            <h1 id="news-title">
                <!-- News Title will be inserted here -->
            </h1>
            <p id="news-description">
                <!-- News Description will be inserted here -->
            </p>
        </article>
    </main>

    <!-- Bottom Ticker Bar -->
    <aside class="sidebar">
        <!--
            The ticker scrolls by translating -50%, so the container must hold
            exactly two identical copies of .ticker-group. script.js renders the
            group template into both copies on every update.
        -->
        <div class="ticker-container" id="ticker-container">
            <div class="ticker-group" data-ticker-group>
                <section class="match-info">
                    <h2>Wedstrijden</h2>
                    <div class="match-card" data-match-card>
                        <div class="loading">Wedstrijden laden...</div>
                    </div>
                </section>

                <section class="standings">
                    <h2>Eredivisie Stand</h2>
                    <div data-standings-table>
                        <div class="loading">Stand laden...</div>
                    </div>
                </section>
            </div>

            <div class="ticker-group" data-ticker-group aria-hidden="true">
                <section class="match-info">
                    <h2>Wedstrijden</h2>
                    <div class="match-card" data-match-card>
                        <div class="loading">Wedstrijden laden...</div>
                    </div>
                </section>

                <section class="standings">
                    <h2>Eredivisie Stand</h2>
                    <div data-standings-table>
                        <div class="loading">Stand laden...</div>
                    </div>
                </section>
            </div>
        </div>
    </aside>

    <!-- Footer -->
    <footer class="footer">
        <p>github.com/owen282000</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
